<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Soma</title>
</head>
<body>
    <nav>
        <a href="/">Início</a> |
        <a href="/soma">Soma</a> |
        <a href="/subtracao">Subtração</a> |
        <a href="/multiplicacao">Multiplicação</a> |
        <a href="/divisao">Divisão</a>
    </nav>

    <h1>Soma</h1>

    <input type="number" id="valor1" placeholder="Primeiro valor">
    +
    <input type="number" id="valor2" placeholder="Segundo valor">
    <button onclick="calcular()">Calcular</button>

    <p id="resultado"></p>

    <script>
        async function calcular() {
            // pega o que a pessoa digitou
            const valor1 = document.getElementById("valor1").value;
            const valor2 = document.getElementById("valor2").value;

            // manda pro python calcular
            const resposta = await fetch("/api/soma", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ valor1: valor1, valor2: valor2 })
            });

            const dados = await resposta.json();
            document.getElementById("resultado").innerText = "Resultado: " + dados.resultado;
        }
    </script>
</body>
</html>
